name: Relatório semanal de segurança

# Toda segunda às 08:00 (Brasília) abre uma issue "Relatório de segurança" (o GitHub manda e-mail)
# e fecha a da semana anterior. Conteúdo: npm audit, cabeçalhos de segurança em produção, validade
# do certificado e o OWASP ZAP baseline, que é passivo (só navega e observa, não ataca).
on:
  schedule:
    - cron: '0 11 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  relatorio:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SITE: https://loja-duavesso.vercel.app/
      HOST: loja-duavesso.vercel.app
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: OWASP ZAP baseline (passivo)
        id: zap
        continue-on-error: true
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: https://loja-duavesso.vercel.app/
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-baseline
      - name: Montar o relatório e abrir a issue
        env:
          DONO: ${{ github.repository_owner }}
          ZAP: ${{ steps.zap.outcome }}
        run: |
          r="$RUNNER_TEMP/relatorio.md"
          echo "@$DONO relatório automático de $(date -u +%F)." > "$r"

          echo -e "\n## Dependências (npm audit)" >> "$r"
          npm audit --json > "$RUNNER_TEMP/audit.json" 2>/dev/null || true
          node -e '
            const a=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));
            const v=(a.metadata||{}).vulnerabilities||{};
            console.log(`crítica ${v.critical||0} · alta ${v.high||0} · média ${v.moderate||0} · baixa ${v.low||0}`);
            for(const [n,x] of Object.entries(a.vulnerabilities||{}))
              console.log(`- ${n} (${x.severity}): ${x.fixAvailable?"tem correção (npm audit fix ou PR do Dependabot)":"sem correção ainda"}`);
          ' "$RUNNER_TEMP/audit.json" >> "$r"

          echo -e "\n## Loja e banco agora" >> "$r"
          node scripts/check-live.mjs >> "$r" || true

          echo -e "\n## Cabeçalhos de segurança extras" >> "$r"
          curl -sSI --max-time 20 "$SITE" > "$RUNNER_TEMP/cab" || true
          for h in referrer-policy permissions-policy cross-origin-opener-policy; do
            if grep -qi "^$h:" "$RUNNER_TEMP/cab"; then echo "- $h: ok" >> "$r"; else echo "- $h: **ausente**" >> "$r"; fi
          done

          echo -e "\n## Certificado HTTPS" >> "$r"
          fim=$(echo | openssl s_client -servername "$HOST" -connect "$HOST:443" 2>/dev/null | openssl x509 -noout -enddate | cut -d= -f2)
          echo "- válido até: ${fim:-não foi possível ler}" >> "$r"

          echo -e "\n## OWASP ZAP baseline" >> "$r"
          if [ -f report_md.md ]; then
            grep -E '^\| (High|Medium|Low|Informational)' report_md.md >> "$r" || echo "- sem alertas" >> "$r"
            echo "- relatório completo no artefato zap-baseline desta execução" >> "$r"
          else
            echo "- não rodou ($ZAP)" >> "$r"
          fi

          echo -e "\n## Onde olhar também" >> "$r"
          echo "- Alertas do Dependabot, secret scanning e code scanning: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/security" >> "$r"
          echo "- Execução: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> "$r"
          cat "$r" >> "$GITHUB_STEP_SUMMARY"

          gh label create seguranca --color 5319E7 --description "Relatório semanal de segurança" --force >/dev/null 2>&1 || true
          for n in $(gh issue list --label seguranca --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Substituída pelo relatório de $(date -u +%F)."
          done
          gh issue create --title "Relatório de segurança $(date -u +%F)" --label seguranca --body-file "$r"
