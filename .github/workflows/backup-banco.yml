name: Backup do banco

# O plano grátis do Supabase não guarda backups que você possa baixar; a documentação recomenda
# `supabase db dump`. O repositório é PÚBLICO: o dump (e-mails, CPF, endereços) é criptografado antes
# de virar artefato, porque artefatos de repositório público podem ser baixados por qualquer pessoa logada.
#
# Segredos que o dono cadastra (Settings > Secrets and variables > Actions). Enquanto não existirem,
# o workflow só avisa e termina sem erro:
#   SUPABASE_DB_URL     string do "Session pooler" (porta 5432) copiada do botão Connect do painel.
#                       A conexão direta db.<ref>.supabase.co é só IPv6 e não funciona no GitHub.
#   BACKUP_PASSPHRASE   frase longa guardada no gerenciador de senhas. Sem ela o backup não abre.
#
# Restaurar (em outro projeto ou Postgres local):
#   gpg -d duavesso-AAAA-MM-DD.tgz.gpg > b.tgz && tar xzf b.tgz
#   psql --single-transaction -v ON_ERROR_STOP=1 -f backup/roles.sql -f backup/schema.sql \
#        -c 'SET session_replication_role = replica' -f backup/data.sql -d "$NOVA_DB_URL"
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-banco
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Conferir os segredos
        id: segredos
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          FRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -n "$DB_URL" ] && [ -n "$FRASE" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::warning::Backup pulado: cadastre SUPABASE_DB_URL e BACKUP_PASSPHRASE nos segredos do repositório."; echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.segredos.outputs.ok == 'true'
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: latest
      - name: Exportar papéis, estrutura e dados
        if: steps.segredos.outputs.ok == 'true'
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          mkdir -p backup
          supabase db dump --db-url "$DB_URL" -f backup/roles.sql --role-only
          supabase db dump --db-url "$DB_URL" -f backup/schema.sql
          supabase db dump --db-url "$DB_URL" -f backup/data.sql --data-only --use-copy
          # Sanidade: o dump precisa ter as tabelas da loja (sem imprimir dados no log público).
          for t in products orders order_items profiles; do
            if grep -Eq "COPY \"?public\"?\.\"?${t}\"? " backup/data.sql; then echo "ok: public.$t"
            else echo "::warning::tabela public.$t não encontrada no data.sql"; fi
          done
          grep -Eq "COPY \"?auth\"?\.\"?users\"? " backup/data.sql && echo "ok: auth.users" || echo "::warning::auth.users fora do dump (contas)"
          ls -l backup
          tar -czf backup.tgz backup
          rm -rf backup
      - name: Criptografar
        if: steps.segredos.outputs.ok == 'true'
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          arquivo="duavesso-$(date -u +%F).tgz.gpg"
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 -o "$arquivo" backup.tgz
          shred -u backup.tgz
          sha256sum "$arquivo" | tee -a "$GITHUB_STEP_SUMMARY"
      - if: steps.segredos.outputs.ok == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backup-banco-${{ github.run_id }}
          path: duavesso-*.tgz.gpg
          retention-days: 90
          if-no-files-found: error
