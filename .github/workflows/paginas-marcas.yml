name: Páginas das marcas

# Todo dia lê as marcas ativas do banco (só a chave pública), regenera as páginas pré-geradas
# (título, descrição, prévia de link, dados estruturados), o sitemap e o retrato dist/marcas.json,
# e publica se algo mudou. Marcas novas já funcionam antes disso; esta rotina é para o Google.
on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paginas-marcas
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Regenerar a partir do banco
        run: node scripts/build-pages.mjs --live
      - name: Publicar se mudou
        run: |
          if [ -z "$(git status --porcelain -- dist)" ]; then echo "Nada mudou nas marcas."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git commit -m "Páginas das marcas atualizadas a partir do banco"
          git push
